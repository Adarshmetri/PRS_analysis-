name: CI Pipeline Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R Dependencies
        run: |
          install.packages(c("data.table", "magrittr", "ggplot2"), repos="https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Lint Shell Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh run_pipeline.sh

      - name: Check R Scripts Syntax
        run: |
          for f in scripts/*.R; do
            echo "Checking syntax of $f..."
            Rscript -e "parse(file='$f')"
          done
